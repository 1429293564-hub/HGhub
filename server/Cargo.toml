[package]
name = "hghub-web"
version = "1.2.1"
description = "HGhub Web 服务：复用客户端 Rust 核心的独立 HTTP 服务"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
axum = "0.7"
http = "1"
tower = "0.5"
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
# 与 src-tauri/Cargo.toml 保持一致：system-proxy 必须显式列出，否则服务器上
# 有系统/环境代理设置时反而不走代理（见 src/net.rs 顶部说明）。
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
  "gzip",
  "brotli",
  "json",
  "charset",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"
rand = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
